name: Front CI/CD

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Couvre src/, e2e/ et scripts/ avec l integralite d eslint-plugin-sonarjs
      # en `error`, plus --max-warnings=0 : une directive eslint-disable devenue
      # inutile echoue au meme titre qu une violation.
      - name: Lint (ESLint + sonarjs)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Duplication (jscpd)
        run: npm run quality:dup

      - name: Duplication des suites de tests (jscpd)
        run: npm run quality:dup:tests

      - name: Code mort (knip)
        run: npm run quality:knip

      - name: Tests des gardes d outillage
        run: npm run test:guards

      # Joue la garde AD-2 / AD-4 sur le depot reel : `test:guards` n execute que
      # ses tests unitaires sur des fixtures temporaires, jamais la garde sur
      # src/cours/ et la surface cours de src/app/.
      - name: Garde runtime cours (AD-2 / AD-4)
        run: npm run guard:cours-runtime

      # Cliquet non-regressif sur les commentaires narratifs : le plafond vit
      # dans `"guard-no-comments".maxOffenses` (package.json). Le gate echoue si
      # le compte depasse le plafond, et imprime la valeur a poser quand il
      # passe dessous.
      - name: Garde no-comment (cliquet)
        run: npm run guard:comments

      - name: Coverage gate
        run: npm run test:cov

      - name: Build
        run: npm run build

      # Joue la regle d inspection du bundle du chantier des lints (feat/lints-cours) :
      # verifie sur l artefact `dist` reellement construit ci-dessus que le corrige et
      # les autres cles presentateur ne voyagent pas jusqu au navigateur de l etudiant.
      - name: Garde bundle cours
        run: npm run guard:cours-bundle

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Empreinte de la version Playwright
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Le cache ne restaure pas les dependances systeme du navigateur :
      # `--with-deps` est rejoue meme sur un cache touche, et n installe que
      # chromium (le seul projet declare par playwright.config.ts).
      - name: Installation de chromium
        run: npx playwright install --with-deps chromium

      - name: Chromium est bien installe
        run: |
          node -e "const { chromium } = require('@playwright/test'); const { existsSync } = require('node:fs'); const chemin = chromium.executablePath(); if (!existsSync(chemin)) { throw new Error('chromium absent du runner: ' + chemin); } console.log('chromium: ' + chemin);"

      # Le build fournit dist/ au serveur SSR que `test:e2e:portail` demarre sur
      # le port 4000 : sans lui, e2e/cours-sitemap.spec.ts n a pas de sitemap a lire.
      - name: Build
        run: npm run build

      - name: Tests e2e Playwright (porte bloquante)
        run: npm run test:e2e:portail

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - quality-gate
      - e2e
      - security
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/timmoyence/portfolio-2025-front:${{ github.sha }}
            ghcr.io/timmoyence/portfolio-2025-front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docker
    steps:
      - name: Check required secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY DEPLOY_REGISTRY_USER DEPLOY_REGISTRY_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Required secrets missing. Skipping deploy."
            exit 1
          fi
      - name: Deploy web container
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE }}
          PROJECT: 'portfolio25'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            WORKDIR="${DEPLOY_PATH:-/opt/portfolio-2025}"
            COMPOSE_FILE="${DEPLOY_COMPOSE_FILE:-$WORKDIR/compose.yaml}"
            FRONT_IMAGE_VALUE="ghcr.io/${{ secrets.DEPLOY_REGISTRY_USER }}/portfolio-2025-front:${{ github.sha }}"
            BACK_IMAGE_VALUE="ghcr.io/${{ secrets.DEPLOY_REGISTRY_USER }}/portfolio-2025-back:latest"

            PROJECT="portfolio25"

            cd "$WORKDIR"
            echo "${{ secrets.DEPLOY_REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.DEPLOY_REGISTRY_USER }}" --password-stdin || true

            BACK_IMAGE="$BACK_IMAGE_VALUE" FRONT_IMAGE="$FRONT_IMAGE_VALUE" \
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" --env-file "$WORKDIR/backend.env" pull web-fr web-en

            BACK_IMAGE="$BACK_IMAGE_VALUE" FRONT_IMAGE="$FRONT_IMAGE_VALUE" \
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" --env-file "$WORKDIR/backend.env" up -d --no-deps web-fr web-en
