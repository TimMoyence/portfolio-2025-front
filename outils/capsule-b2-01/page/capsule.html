<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Capsule B2-01 — Une formule qui se recopie, un tableau qui se contrôle</title>
    <style>
      @font-face {
        font-family: 'Atkinson Hyperlegible';
        font-weight: 400;
        font-style: normal;
        src: url('fonts/atkinson-hyperlegible-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible';
        font-weight: 700;
        font-style: normal;
        src: url('fonts/atkinson-hyperlegible-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible';
        font-weight: 400;
        font-style: italic;
        src: url('fonts/atkinson-hyperlegible-latin-400-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400;
        font-style: normal;
        src: url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 700;
        font-style: normal;
        src: url('fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2');
      }

      :root {
        --fond: #fbf7ef;
        --texte: #1f2a30;
        --accent: #0f6e6e;
        --arrivee: #1f5fbf;
        --depart: #b4400b;
        --erreur: #b3261e;
        --ok: #1e6b3a;
        --gris: #545d63;
        --cellule: #ffffff;
        --entete: #ece5d6;
        --trait: #8f887c;
        --blanc: #ffffff;
      }

      * {
        box-sizing: border-box;
        transition: none !important;
        animation: none !important;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--fond);
      }

      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: 'Atkinson Hyperlegible', sans-serif;
        color: var(--texte);
        -webkit-font-smoothing: antialiased;
      }

      .mono {
        font-family: 'JetBrains Mono', monospace;
      }

      #scene {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--fond);
      }

      .vue {
        position: absolute;
        inset: 0;
      }

      /* Carton titre (P01) */
      #titre {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 90px;
        text-align: center;
      }
      #titre h1 {
        margin: 0;
        font-size: 60px;
        line-height: 1.15;
        font-weight: 700;
      }
      #titre .filet {
        width: 120px;
        height: 6px;
        margin: 34px 0 26px;
        border-radius: 3px;
        background: var(--accent);
      }
      #titre p {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        color: var(--accent);
      }

      /* Barre de formule */
      #barre {
        position: absolute;
        left: 40px;
        top: 40px;
        width: 740px;
        height: 55px;
        display: flex;
        border: 2px solid var(--trait);
        border-radius: 6px;
        background: var(--cellule);
        overflow: hidden;
      }
      #barre-nom {
        width: 92px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 2px solid var(--trait);
        background: var(--entete);
        font-size: 28px;
        font-weight: 700;
      }
      #barre-formule {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 28px;
        white-space: pre;
      }
      #barre-formule .dollar {
        font-weight: 700;
        color: var(--accent);
      }
      #barre-formule .ref-arrivee {
        color: var(--arrivee);
        font-weight: 700;
      }
      #barre-formule .ref-depart {
        color: var(--depart);
        font-weight: 700;
      }
      #barre-formule .clignote {
        background: var(--depart);
        color: var(--blanc);
      }
      #barre-formule .caret {
        display: inline-block;
        width: 3px;
        height: 32px;
        margin-left: 2px;
        background: var(--texte);
      }

      #fictives {
        position: absolute;
        right: 40px;
        top: 48px;
        height: 40px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        border: 2px solid var(--texte);
        border-radius: 20px;
        font-size: 22px;
        font-weight: 700;
        background: var(--fond);
      }

      /* Grille */
      .entete-col,
      .entete-ligne {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--entete);
        font-size: 18px;
        font-weight: 700;
      }
      .cellule {
        position: absolute;
        width: 148px;
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        background: var(--cellule);
        font-size: 22px;
        line-height: 22px;
        white-space: pre;
      }
      .cellule.nombre {
        justify-content: flex-end;
        font-variant-numeric: tabular-nums;
      }
      .cellule.entete-donnees {
        font-weight: 700;
      }
      .cellule.large {
        width: 296px;
        z-index: 1;
      }
      .cellule.externe {
        color: var(--gris);
        font-style: italic;
      }
      .cellule.en-edition {
        background: #e3f0ef;
      }
      .cellule.erreur {
        color: var(--erreur);
        font-weight: 700;
        background: #fbeceb;
        justify-content: flex-end;
        gap: 6px;
      }
      .cellule.controle-ok {
        color: var(--ok);
        font-weight: 700;
        background: #e1efe5;
      }
      .cellule.controle-ko {
        color: var(--erreur);
        font-weight: 700;
        background: #fbeceb;
      }
      .cellule .etiquette-cellule {
        margin-right: auto;
      }

      #traits {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
      }

      .marque {
        position: absolute;
        pointer-events: none;
      }
      .marque.arrivee {
        border: 3px solid var(--arrivee);
        background: rgba(31, 95, 191, 0.1);
      }
      .marque.depart {
        border: 3px solid var(--depart);
        background: rgba(180, 64, 11, 0.1);
      }
      .marque.plage {
        border: 3px solid var(--accent);
        background: rgba(15, 110, 110, 0.12);
      }
      .marque.vide {
        border: 3px dashed var(--texte);
      }
      .marque.selection {
        border: 3px solid var(--accent);
      }
      .marque.selection::after {
        content: '';
        position: absolute;
        right: -6px;
        bottom: -6px;
        width: 9px;
        height: 9px;
        background: var(--accent);
        border: 1px solid var(--cellule);
      }
      .marque.impulsion {
        border: 4px solid var(--texte);
      }

      .puce {
        position: absolute;
        height: 26px;
        padding: 0 9px;
        display: flex;
        align-items: center;
        gap: 5px;
        border-radius: 13px;
        font-size: 17px;
        font-weight: 700;
        color: var(--blanc);
        white-space: nowrap;
        z-index: 3;
      }
      .puce.arrivee {
        background: var(--arrivee);
      }
      .puce.depart {
        background: var(--depart);
      }
      .puce.erreur {
        background: var(--erreur);
      }
      .puce.ok {
        background: var(--ok);
      }
      .puce.neutre {
        background: var(--texte);
      }
      .puce.vide {
        background: var(--fond);
        color: var(--texte);
        border: 2px solid var(--texte);
      }
      .puce.externe {
        background: var(--gris);
      }
      .puce.grande {
        height: 38px;
        padding: 0 14px;
        border-radius: 8px;
        font-size: 20px;
      }

      .puce-cellule {
        height: 26px;
        padding: 0 8px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 13px;
        font-size: 16px;
        font-weight: 700;
        font-style: normal;
        color: var(--blanc);
      }
      .puce-cellule.ok {
        background: var(--ok);
      }
      .puce-cellule.erreur {
        background: var(--erreur);
      }

      #bouton {
        position: absolute;
        left: 40px;
        top: 582px;
        height: 42px;
        padding: 0 22px;
        display: flex;
        align-items: center;
        border: 2px solid var(--accent);
        border-radius: 21px;
        background: var(--cellule);
        color: var(--accent);
        font-size: 21px;
        font-weight: 700;
      }
      #bouton.presse {
        background: #d9ecea;
      }

      /* Panneau d’explication */
      #panneau {
        position: absolute;
        left: 810px;
        top: 110px;
        width: 430px;
        height: 515px;
      }
      .panneau-plan {
        position: absolute;
        inset: 0;
      }
      .panneau-titre {
        margin: 0 0 18px;
        padding-bottom: 10px;
        border-bottom: 3px solid var(--accent);
        font-size: 25px;
        font-weight: 700;
        color: var(--accent);
      }
      .item {
        margin: 0 0 16px;
        font-size: 25px;
        line-height: 1.3;
      }
      .item .mono {
        font-size: 23px;
      }
      .item.carte {
        padding: 12px 14px;
        border-left: 5px solid var(--accent);
        background: #f1ebdf;
      }
      .ligne-formule {
        margin: 0 0 8px;
        font-size: 24px;
        white-space: pre;
      }
      .ligne-formule b {
        font-weight: 700;
        color: var(--accent);
      }
      .ligne-formule b.faux {
        color: var(--erreur);
      }
      .mot-arrivee {
        color: var(--arrivee);
        font-weight: 700;
      }
      .mot-depart {
        color: var(--depart);
        font-weight: 700;
      }
      .controle-ligne {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      #accolades {
        position: absolute;
        left: 0;
        top: 44px;
      }
      .legende {
        position: absolute;
        left: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 25px;
      }
      .pastille {
        width: 34px;
        height: 34px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--accent);
        color: var(--blanc);
        font-size: 20px;
        font-weight: 700;
      }

      /* Récapitulatif (P10) */
      .carte-recap {
        position: absolute;
        width: 590px;
        height: 205px;
        padding: 26px 28px;
        border: 3px solid var(--accent);
        border-radius: 14px;
        background: var(--cellule);
      }
      .carte-recap .numero {
        width: 54px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--accent);
        color: var(--blanc);
        font-size: 30px;
        font-weight: 700;
      }
      .carte-recap h2 {
        position: absolute;
        left: 100px;
        top: 30px;
        margin: 0;
        font-size: 34px;
      }
      .carte-recap p {
        margin: 26px 0 0;
        font-size: 29px;
      }
      #a-vous {
        position: absolute;
        left: 40px;
        right: 40px;
        top: 572px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 25px;
        background: var(--accent);
        color: var(--blanc);
        font-size: 28px;
        font-weight: 700;
      }
      #recap-titre {
        position: absolute;
        left: 40px;
        top: 34px;
        margin: 0;
        font-size: 36px;
        color: var(--accent);
      }

      /* Crédits (P11) */
      #credits {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 70px 90px;
        text-align: center;
      }
      #credits h2 {
        margin: 0 0 12px;
        font-size: 34px;
      }
      #credits p {
        margin: 7px 0;
        font-size: 23px;
        line-height: 1.35;
      }
      #credits .licence {
        font-weight: 700;
        color: var(--accent);
      }

      #curseur {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 20;
        pointer-events: none;
      }
      .anneau {
        position: absolute;
        border: 4px solid var(--accent);
        border-radius: 50%;
        z-index: 19;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <script type="module" src="capsule.js"></script>
  </body>
</html>
