<app-asili-hero [titre]="titre" [kicker]="heroKicker" [lead]="heroLead"> </app-asili-hero>

@for (famille of familles; track famille.id) {
  <app-asili-projects-grid
    [projects]="famille.cartes"
    [heading]="famille.titre"
    [kicker]="famille.precision ?? null"
  />
}

<app-asili-method [steps]="methodSteps" [kicker]="methodKicker">
  <h2 heading class="h-lg method-head__title">
    <ng-container i18n="@@projetsMethodHeading"
      >Chaque projet suit la même logique : <em>clarté d'abord</em>.</ng-container
    >
  </h2>
</app-asili-method>

<app-asili-cta-band [contenu]="{ kicker: ctaKicker, title: ctaTitle, actions: ctaActions }" />
