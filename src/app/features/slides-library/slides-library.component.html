<app-slide-deck mode="scroll" [allowFullscreen]="true" theme="library">
  <app-slide id="hero">
    <app-slide-hero
      title="Slides Library"
      subtitle="Catalogue interne — non indexe"
      bgImage="/assets/images/bordeaux-placeholder.webp"
      bgImageAlt="Vue de Bordeaux en arriere-plan du catalogue de slides"
    />
  </app-slide>

  <app-slide id="image-left">
    <app-slide-image-left
      image="/assets/images/offer/strategy-illustration.webp"
      imageAlt="Illustration strategie, demo du layout image a gauche"
      title="slide-image-left"
    >
      <p>Layout 50/50 image a gauche, contenu a droite.</p>
    </app-slide-image-left>
  </app-slide>

  <app-slide id="image-right">
    <app-slide-image-right
      image="/assets/images/offer/automation-illustration.webp"
      imageAlt="Illustration automatisation, demo du layout image a droite"
      title="slide-image-right"
    >
      <p>Layout 50/50 contenu a gauche, image a droite.</p>
    </app-slide-image-right>
  </app-slide>

  <!--
    Le repo ne contient aucun asset video : la slide demontre donc le layout via
    son poster seul (src vide = pas de requete vers un fichier inexistant).
    Pour une demo lisible : deposer une video dans public/videos/ et renseigner
    src, ou passer type="iframe" avec une URL YouTube nocookie / Vimeo.
  -->
  <app-slide id="video">
    <app-slide-video
      src=""
      poster="/assets/images/audit.webp"
      caption="slide-video : layout natif (source video a fournir)"
    />
  </app-slide>

  <app-slide id="stats">
    <app-slide-stats
      title="slide-stats"
      [stats]="[
        { value: '3', label: 'layouts', source: 'lib' },
        { value: '9', label: 'composants slides' },
        { value: '∞', label: 'compositions possibles' },
      ]"
    />
  </app-slide>

  <app-slide id="quote">
    <app-slide-quote
      quote="La meilleure architecture est celle que tu peux composer."
      author="Auteur fictif"
      role="Slides Library"
    />
  </app-slide>

  <app-slide id="comparison">
    <app-slide-comparison
      title="slide-comparison"
      [columns]="[
        {
          label: 'Avant',
          tone: 'danger',
          items: ['data.ts', 'registry', 'page-generic'],
        },
        {
          label: 'Apres',
          tone: 'success',
          items: ['composants', 'composition', 'flexibilite'],
        },
      ]"
    />
  </app-slide>

  <app-slide id="grid">
    <app-slide-grid
      title="slide-grid"
      [items]="[
        { title: 'Layout', description: 'Une carte par item' },
        { title: 'Responsive', description: 'auto-fit minmax' },
        { title: 'Lien optionnel', description: 'href facultatif' },
      ]"
    />
  </app-slide>

  <app-slide id="quiz">
    <app-slide-quiz slug="ia-solopreneurs" interactionId="demo-quiz" />
  </app-slide>

  <app-slide id="poll">
    <app-slide-poll slug="ia-solopreneurs" interactionId="demo-poll" />
  </app-slide>

  <app-slide id="reflection">
    <app-slide-reflection
      slug="ia-solopreneurs"
      interactionId="demo-reflection"
    />
  </app-slide>

  <app-slide id="cta">
    <app-slide-cta
      title="Pret a composer ?"
      description="Importe les composants partages et compose ta presentation."
      ctaLabel="Voir le code"
      ctaHref="https://github.com/"
    />
  </app-slide>
</app-slide-deck>
