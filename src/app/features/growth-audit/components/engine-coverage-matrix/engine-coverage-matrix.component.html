<div class="engine-matrix grid gap-4 grid-cols-1 md:grid-cols-2">
  <ng-container
    *ngTemplateOutlet="
      carteMoteur;
      context: { $implicit: matrix.googleVisibility, titre: titreGoogle }
    "
  />
  <ng-container
    *ngTemplateOutlet="carteMoteur; context: { $implicit: matrix.aiVisibility, titre: titreIa }"
  />
</div>

<ng-template #titreGoogle>
  <ng-container i18n="@@auditEngineGoogleVisibility"> Visibilité Google </ng-container>
</ng-template>

<ng-template #titreIa>
  <ng-container i18n="@@auditEngineAiVisibility"> Visibilité IA </ng-container>
</ng-template>

<ng-template #carteMoteur let-visibilite let-titre="titre">
  <div
    data-testid="engine-card"
    class="engine-card rounded-form border border-scheme-border bg-scheme-surface p-5 flex flex-col gap-3"
  >
    <p class="text-xs uppercase tracking-wide text-scheme-text-muted font-semibold">
      <ng-container [ngTemplateOutlet]="titre" />
    </p>
    <div class="flex items-baseline gap-2">
      <span class="engine-card__score text-4xl font-semibold">
        {{ visibilite.score }}
      </span>
      <span class="text-sm text-scheme-text-muted">/100</span>
    </div>
    <div class="engine-card__bar h-2 w-full rounded-full bg-scheme-background overflow-hidden">
      <div
        class="engine-card__bar-fill h-full rounded-full"
        [class]="scoreClass(visibilite.score)"
        [style.width.%]="visibilite.score"
      ></div>
    </div>
    <p class="text-sm text-scheme-text">
      {{ visibilite.summary }}
    </p>
  </div>
</ng-template>
