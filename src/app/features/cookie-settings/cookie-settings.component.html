<section class="lg-hero">
  <div class="wrap" appReveal>
    <span class="kicker">{{ hero.kicker }}</span>
    <h1 i18n="@@cookieSettingsHeroTitle">Préférences <em>cookies</em>.</h1>
    <div class="updated"><span class="dot"></span>{{ hero.updated }}</div>
  </div>
</section>

<section class="ck-section">
  <div class="wrap">
    <p class="lead ck-intro">{{ intro }}</p>

    <div class="ck-list" appReveal>
      <div class="ck-item">
        <ng-container
          *ngTemplateOutlet="texteCategorie; context: { $implicit: categories.essential }"
        />
        <label class="switch">
          <input type="checkbox" checked disabled [attr.aria-label]="toggleAria.essential" />
          <span class="track"></span>
        </label>
      </div>

      <ng-container *ngTemplateOutlet="categorieFigee; context: contexteFige('analytics')" />

      <div class="ck-item">
        <ng-container
          *ngTemplateOutlet="texteCategorie; context: { $implicit: categories.preferences }"
        />
        <label class="switch">
          <input
            type="checkbox"
            [(ngModel)]="preferences.preferences"
            [attr.aria-label]="toggleAria.preferences"
          />
          <span class="track"></span>
        </label>
      </div>

      <ng-container *ngTemplateOutlet="categorieFigee; context: contexteFige('marketing')" />
    </div>

    <ng-template #texteCategorie let-categorie>
      <div class="ck-txt">
        <h3>{{ categorie.title }}</h3>
        <p>{{ categorie.description }}</p>
        <span class="ck-tag">{{ categorie.tag }}</span>
      </div>
    </ng-template>

    <ng-template #categorieFigee let-categorie let-actif="actif" let-aria="aria">
      <div class="ck-item">
        <ng-container *ngTemplateOutlet="texteCategorie; context: { $implicit: categorie }" />
        <label class="switch">
          <input type="checkbox" [checked]="actif" disabled [attr.aria-label]="aria" />
          <span class="track"></span>
        </label>
      </div>
    </ng-template>

    <div class="ck-actions">
      <button type="button" class="btn btn-teal" (click)="savePreferences()" [disabled]="isSaving">
        {{ actions.save }} <span class="arrow">→</span>
      </button>
      <button type="button" class="btn btn-ghost" (click)="acceptAll()" [disabled]="isSaving">
        {{ actions.acceptAll }}
      </button>
      <span class="ck-saved" [class.show]="showSaved">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path
            d="M5 12.5 10 17l9-10"
            stroke="var(--teal-deep)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        {{ actions.saved }}
      </span>
    </div>

    @if (statusMessage && !showSaved) {
      <p class="ck-status" role="status">{{ statusMessage }}</p>
    }

    <p class="ck-privacy-note">
      {{ privacyNote.before }}
      <a class="inl" routerLink="/privacy">{{ privacyNote.link }}</a
      >.
    </p>
  </div>
</section>
