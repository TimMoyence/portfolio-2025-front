@let cta = contenu();
<section class="cta-band-section section-pad">
  <div class="wrap">
    <div class="cta" appReveal>
      <div class="cta-inner">
        <ng-content select="[kicker]">
          @if (cta.kicker; as k) {
            <span class="kicker cta-kicker">{{ k }}</span>
          }
        </ng-content>
        <h2 class="cta-title">{{ cta.title }}</h2>
        <ng-content select="[lead]">
          @if (cta.lead; as l) {
            <p class="cta-lead">{{ l }}</p>
          }
        </ng-content>
        <div class="cta-actions">
          @for (action of cta.actions ?? []; track action.lien) {
            @if (action.variante === 'principale') {
              <a class="btn btn-teal" [routerLink]="action.lien">
                {{ action.libelle }} <span class="arrow" aria-hidden="true">→</span>
              </a>
            } @else {
              <a class="btn btn-ghost" [routerLink]="action.lien">{{ action.libelle }}</a>
            }
          }
          <ng-content select="[cta]"></ng-content>
        </div>
      </div>
    </div>
  </div>
</section>
