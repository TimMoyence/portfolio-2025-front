<section class="projects-section section-pad">
  <div class="wrap">
    <div class="projects-head">
      <div>
        <ng-content select="[kicker]"><app-asili-kicker [texte]="kicker()" /></ng-content>
        <ng-content select="[heading]">
          @if (heading(); as h) {
            <h2 class="h-xl projects-head__title">{{ h }}</h2>
          }
        </ng-content>
      </div>
      <ng-content select="[headLink]"></ng-content>
    </div>

    <div class="proj-grid">
      @for (project of projects(); track project.href) {
        <article class="proj">
          <a class="proj-link" [routerLink]="project.href" [state]="{ vignette: true }">
            <div class="proj-shot">
              <img
                [src]="project.image"
                [attr.srcset]="project.srcset"
                [attr.sizes]="cadre.sizes"
                [alt]="project.imageAlt"
                [style.view-transition-name]="project.vignette"
                [attr.width]="cadre.width"
                [attr.height]="cadre.height"
                loading="lazy"
                decoding="async"
              />
            </div>
          </a>

          <div class="proj-body">
            <div class="proj-meta">
              @for (tag of project.tags; track tag.label) {
                <span class="tag" [class.tag-prod]="tag.prod">{{ tag.label }}</span>
              }
            </div>
            <h3>{{ project.title }}</h3>
            <p>{{ project.desc }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
