<div #deckRoot [class]="cssClasses()" tabindex="0">
  @if (service.mode() === 'fullscreen') {
    <swiper-container
      navigation="true"
      keyboard="true"
      pagination="true"
      [attr.initial-slide]="currentVisibleIndex()"
    >
      @for (slide of visibleSlides(); track slide.id()) {
        <swiper-slide>
          <ng-container *ngTemplateOutlet="slide.contentTemplate()" />
        </swiper-slide>
      }
    </swiper-container>
  } @else {
    @for (slide of visibleSlides(); track slide.id()) {
      <ng-container *ngTemplateOutlet="slide.contentTemplate()" />
    }
  }

  @if (allowFullscreen()) {
    <button
      type="button"
      class="slide-deck-fullscreen"
      data-testid="slide-deck-fullscreen-toggle"
      (click)="toggleFullscreen()"
      [attr.aria-label]="libellePlein()"
    >
      <span class="slide-deck-fullscreen__icon" aria-hidden="true">⛶</span>
      <span class="slide-deck-fullscreen__label">{{ libelleCompact() }}</span>
    </button>
  }

  <div class="slide-deck-progress" role="status" aria-live="polite">
    <span>{{ currentVisibleIndex() + 1 }} / {{ visibleSlides().length }}</span>
  </div>
</div>
