@if (poll(); as p) {
  <div class="slide-poll">
    <h3 class="slide-poll__question">{{ p.question }}</h3>
    <div class="slide-poll__options">
      @for (opt of p.options; track opt; let i = $index) {
        <button
          type="button"
          class="slide-poll__option"
          [class.is-voted]="votedIndex() === i"
          [disabled]="hasVoted()"
          [attr.aria-current]="votedIndex() === i ? 'true' : null"
          (click)="vote(i)"
        >
          <span class="slide-poll__label">{{ opt }}</span>
        </button>
      }
    </div>

    <p class="slide-poll__status" role="status" aria-live="polite">
      @if (votedLabel(); as label) {
        <span i18n="@@slidePollVotreChoix">Votre choix : {{ label }}</span>
      }
    </p>
  </div>
} @else if (error()) {
  <p class="slide-poll__status" role="alert" i18n="@@slidePollIndisponible">
    Ce sondage n’a pas pu être chargé.
  </p>
}
