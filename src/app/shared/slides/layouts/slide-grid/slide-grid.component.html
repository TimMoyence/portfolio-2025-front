<div class="slide-grid">
  @if (title()) {
    <h2>{{ title() }}</h2>
  }
  @if (subtitle()) {
    <p class="slide-grid__subtitle">{{ subtitle() }}</p>
  }
  @if (imprimable()) {
    <button
      type="button"
      class="slide-grid__imprimer"
      data-testid="slide-grid-imprimer"
      (click)="imprimer()"
      i18n="@@slideGridImprimer"
    >
      Imprimer ou enregistrer en PDF
    </button>
  }
  <div class="slide-grid__grid" [class.is-five]="items().length === 5">
    @for (item of items(); track item.title) {
      @if (item.href) {
        <a
          class="slide-grid__card"
          [href]="item.href"
          [target]="item.external ? '_blank' : null"
          [rel]="item.external ? 'noreferrer' : null"
        >
          <ng-container *ngTemplateOutlet="cardBody; context: { $implicit: item }" />
        </a>
      } @else if (item.back) {
        <button
          type="button"
          class="slide-grid__card slide-grid__card--flip"
          [class.is-flipped]="isFlipped(item.title)"
          [attr.aria-pressed]="isFlipped(item.title)"
          [attr.aria-label]="libelleBascule(item.title)"
          (click)="toggle(item.title)"
        >
          <span class="slide-grid__face slide-grid__face--front">
            <ng-container *ngTemplateOutlet="cardBody; context: { $implicit: item }" />
          </span>
          <span class="slide-grid__face slide-grid__face--back">
            <strong>{{ item.title }}</strong>
            <span>{{ item.back }}</span>
          </span>
        </button>
      } @else {
        <div class="slide-grid__card">
          <ng-container *ngTemplateOutlet="cardBody; context: { $implicit: item }" />
        </div>
      }
    }
  </div>
</div>

<ng-template #cardBody let-item>
  @if (item.icon) {
    <div class="slide-grid__icon">{{ item.icon }}</div>
  }
  <h3>{{ item.title }}</h3>
  <p>{{ item.description }}</p>
</ng-template>
