<div
  class="slide-table"
  [class.slide-table--dense]="dense()"
  [appSlideEnTete]="{ bloc: 'slide-table', titre: title(), sousTitre: subtitle() }"
>
  <app-defileur-de-tableau class="slide-table__scroll">
    <table appTableauDeCellules [entete]="entete()" [lignes]="lignes()"></table>
  </app-defileur-de-tableau>
  @if (note()) {
    <p class="slide-table__note">{{ note() }}</p>
  }
</div>
