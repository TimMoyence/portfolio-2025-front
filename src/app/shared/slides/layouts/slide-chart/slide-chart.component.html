<figure class="slide-chart">
  <header class="slide-chart__header">
    <div>
      <p class="slide-chart__eyebrow">{{ caption() }}</p>
      <h2>{{ title() }}</h2>
      @if (context()) {
        <p class="slide-chart__context">{{ context() }}</p>
      }
    </div>
    @if (unit()) {
      <span class="slide-chart__unit">{{ unit() }}</span>
    }
  </header>

  @if (description()) {
    <p class="slide-chart__description" data-testid="slide-chart-description" [id]="idDescription">
      {{ description() }}
    </p>
  }

  <div
    class="slide-chart__plot has-axes"
    [class.is-line]="kind() === 'line'"
    role="img"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="description() ? idDescription : null"
  >
    <div class="slide-chart__grid" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="slide-chart__axes" aria-hidden="true" data-testid="slide-chart-axes">
      <div class="slide-chart__axis slide-chart__axis--left">
        @if (axisRanges().length >= 2) {
          <span class="slide-chart__axis-title">{{ axisLabels()[0] }}</span>
        }
        @for (tick of axisTicks(echelle()); track $index) {
          <span data-testid="slide-chart-graduation">{{ tick }}</span>
        }
      </div>
      @if (axisRanges().length >= 2) {
        <div class="slide-chart__axis slide-chart__axis--right">
          <span class="slide-chart__axis-title">{{ axisLabels()[1] }}</span>
          @for (tick of axisTicks(axisRanges()[1]); track $index) {
            <span>{{ tick }}</span>
          }
        </div>
      }
    </div>

    @if (kind() === 'line') {
      <svg
        class="slide-chart__svg"
        viewBox="0 0 800 320"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        @for (serie of series(); track serie.label; let rangSerie = $index) {
          <polyline
            class="slide-chart__line"
            [class]="'tone-' + (serie.tone ?? 'teal')"
            [attr.points]="linePoints(serie)"
            [class.is-visible]="step() >= labels().length - 1"
          />
          @for (value of serie.values; track $index) {
            <g
              class="slide-chart__point"
              [class]="'tone-' + (serie.tone ?? 'teal')"
              [class.is-visible]="$index <= step()"
              [attr.data-marqueur]="marqueur(rangSerie)"
            >
              @switch (marqueur(rangSerie)) {
                @case ('carre') {
                  <rect
                    [attr.x]="pointX($index) - 7"
                    [attr.y]="pointY(value) - 7"
                    width="14"
                    height="14"
                  />
                }
                @case ('losange') {
                  <polygon [attr.points]="losange(pointX($index), pointY(value))" />
                }
                @default {
                  <circle [attr.cx]="pointX($index)" [attr.cy]="pointY(value)" r="7" />
                }
              }
              <text [attr.x]="pointX($index)" [attr.y]="pointY(value) - 16">
                {{ formatValue(value) }}
              </text>
            </g>
          }
          @if (serie.values.length > 0) {
            <text
              class="slide-chart__serie-label"
              data-testid="slide-chart-etiquette"
              text-anchor="end"
              [attr.x]="pointX(serie.values.length - 1) - 12"
              [attr.y]="pointY(serie.values[serie.values.length - 1]) + 26"
            >
              {{ serie.label }}
            </text>
          }
        }
      </svg>
    } @else {
      <div class="slide-chart__bars" [style.--count]="labels().length">
        @for (label of labels(); track label; let index = $index) {
          <div class="slide-chart__group">
            <div class="slide-chart__bar-set">
              @for (serie of series(); track serie.label) {
                <div class="slide-chart__bar-wrap">
                  <span
                    class="slide-chart__bar"
                    [class]="'tone-' + (serie.tone ?? 'teal')"
                    [class.is-visible]="index <= step()"
                    [style.--height]="hauteur(serie.values[index], $index) + '%'"
                  ></span>
                  <span class="slide-chart__value" [class.is-visible]="index <= step()">
                    {{ formatValue(serie.values[index]) }}
                  </span>
                </div>
              }
            </div>
            <span class="slide-chart__label">{{ label }}</span>
          </div>
        }
      </div>
    }

    @if (kind() === 'line') {
      <div class="slide-chart__labels" [style.--count]="labels().length" aria-hidden="true">
        @for (label of labels(); track label) {
          <span>{{ label }}</span>
        }
      </div>
    }
  </div>

  @if (formula()) {
    <p class="slide-chart__takeaway">{{ formula() }}</p>
  }

  @if (reading()) {
    <p class="slide-chart__reading">
      <strong i18n="@@slideChartLecture">Lecture professionnelle</strong>{{ reading() }}
    </p>
  }

  <details class="slide-chart__data">
    <summary i18n="@@slideChartVoirDonnees">Voir les données</summary>
    <div class="slide-chart__table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">{{ caption() || libellePeriode }}</th>
            @for (label of labels(); track label) {
              <th scope="col">{{ label }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (serie of series(); track serie.label) {
            <tr>
              <th scope="row">{{ serie.label }}</th>
              @for (value of serie.values; track $index) {
                <td>{{ formatValue(value) }}</td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
    @if (source()) {
      <p class="slide-chart__source" i18n="@@slideChartSource">Source : {{ source() }}</p>
    }
  </details>

  <ul class="slide-chart__legend" aria-label="Légende" i18n-aria-label="@@slideChartLegende">
    @for (serie of series(); track serie.label) {
      <li [class]="'tone-' + (serie.tone ?? 'teal')">
        <span aria-hidden="true"></span>{{ serie.label }}
      </li>
    }
  </ul>
</figure>
