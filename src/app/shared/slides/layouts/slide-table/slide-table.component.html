<div class="slide-table">
  @if (title()) {
    <h2>{{ title() }}</h2>
  }
  @if (subtitle()) {
    <p class="slide-table__subtitle">{{ subtitle() }}</p>
  }
  <div class="slide-table__scroll">
    <table>
      <thead>
        <tr>
          @for (col of columns(); track col.key) {
            <th scope="col">{{ col.label }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track $index) {
          <tr>
            @for (col of columns(); track col.key) {
              <td>{{ cellValue(row, col.key) }}</td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
  @if (note()) {
    <p class="slide-table__note">{{ note() }}</p>
  }
</div>
