<div class="slide-cta">
  <div class="slide-cta__content">
    <h2>{{ title() }}</h2>
    @if (description()) {
      <p>{{ description() }}</p>
    }
    @if (estCheminInterne(ctaHref())) {
      <a class="slide-cta__btn" [routerLink]="ctaHref()">{{ ctaLabel() }}</a>
    } @else {
      <a class="slide-cta__btn" [href]="ctaHref()">{{ ctaLabel() }}</a>
    }
  </div>
</div>
